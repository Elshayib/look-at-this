name: look-at-this
version: 0.2.1
description: >-
  Seamless one-shot screen & window context for Hermes: press a global hotkey,
  pick an open window, drag a screen region, or run /look — opens a fresh session
  by default (or asks where the capture should go) and attaches the screenshot
  ephemerally to vision models alongside smart UI context, URL, and selection.
author: Elshayib
license: MIT
homepage: https://github.com/Elshayib/look-at-this
tags:
  - screen-capture
  - screenshot
  - vision
  - desktop
  - accessibility
  - ui-context
  - multimodal
manifest_version: 2
requires_hermes: ">=0.22.6"
platforms:
  - windows
  - macos
  - linux
provides_tools:
  - lat_grab
  - lat_windows
  - lat_status
  - lat_clear
provides_hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_end
provides_middleware:
  - llm_request
config_schema:
  hotkey_target:
    type: str
    default: new_session
    description: >-
      Where global hotkey captures go in Hermes Desktop: 'new_session' (default —
      opens a new session with the capture attached), 'ask' (asks whether to open a
      new session, use the current session, or pick an open session), or
      'current_session' (attaches to the currently open session).
  ttl_seconds:
    type: int
    default: 300
    description: Seconds a captured packet remains queued before expiring automatically.
  window_hotkey:
    type: str
    default: ctrl+alt+l
    description: System-wide shortcut to capture the foreground window immediately (set empty to disable).
  snip_hotkey:
    type: str
    default: ctrl+alt+s
    description: System-wide shortcut to open the interactive window-hover & region-snipping overlay.
  focus_hermes_on_hotkey:
    type: bool
    default: true
    description: Bring Hermes Desktop and its message composer to focus right after a global hotkey capture.
  hotkey_hud_feedback:
    type: bool
    default: true
    description: Show a brief click-through on-screen confirmation pill when a global hotkey captures a window.
  vision_injection:
    type: bool
    default: true
    description: Send the screenshot directly to vision-capable models on that turn (ephemerally, never saved in chat history).
  default_redact:
    type: bool
    default: false
    description: Enable sensitive-text redaction (emails, API keys, tokens, card numbers, auth URL params) by default on new captures.
  include_full_tree_by_default:
    type: bool
    default: false
    description: Include the full accessibility tree on every capture by default instead of compact smart context only.
  max_tree_elements:
    type: int
    default: 200
    description: Maximum accessibility elements walked when full tree extraction is enabled.
  max_image_dim:
    type: int
    default: 1920
    description: Maximum screenshot width/height in pixels (downscales ultra-high-DPI captures cleanly).
  excluded_apps:
    type: list
    default:
      - 1password
      - 1password7
      - bitwarden
      - keepass
      - keepassxc
      - lastpass
      - dashlane
      - nordpass
      - enpass
      - keeper
      - protonpass
    description: Password managers and sensitive apps that are refused before any screenshot is taken.
  excluded_title_patterns:
    type: list
    default:
      - "(?i)\\b(?:incognito|inprivate)\\b"
      - "(?i)\\bprivate\\s+(?:browsing|window)\\b"
    description: Regular expressions matched against window titles to refuse private/incognito windows.
